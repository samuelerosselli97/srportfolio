<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090f;font-family:'Share Tech Mono',monospace;color:#c8d8f0;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:44px;
  background:#0a0d18;border-bottom:1px solid #1a2840;
  flex-shrink:0;
}
.tb-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px}
.tb-sub{font-size:10px;color:#3a5070;margin-left:12px;letter-spacing:2px}
.tb-tags{display:flex;gap:8px}
.tag{font-size:9px;padding:3px 8px;border-radius:2px;border:1px solid;letter-spacing:1px}
.tag-cyan{color:#00e5ff;border-color:rgba(0,229,255,.35);background:rgba(0,229,255,.08)}
.tag-green{color:#00ff88;border-color:rgba(0,255,136,.35);background:rgba(0,255,136,.08)}
.tag-amber{color:#ffb300;border-color:rgba(255,179,0,.35);background:rgba(255,179,0,.08)}

/* ── LEGEND ── */
#legend{
  display:flex;align-items:center;gap:20px;
  padding:6px 20px;height:32px;
  background:#080b16;border-bottom:1px solid #131e30;
  flex-shrink:0;font-size:10px;color:#4a6a8a;letter-spacing:1px;
  flex-wrap:wrap;
}
.leg{display:flex;align-items:center;gap:6px}
.leg-line{width:24px;height:2px;border-radius:1px}

/* ── CANVAS AREA ── */
#canvas-wrap{flex:1;position:relative;overflow:hidden}
svg#topo{width:100%;height:100%;cursor:default}

/* ── DEVICE PANEL — desktop ── */
#panel-overlay{
  position:fixed;inset:0;
  z-index:200;
  pointer-events:none;
  visibility:hidden;
}
#panel-overlay.open{ visibility:visible; }

#panel{
  position:fixed;
  right:16px;top:16px;bottom:16px;
  width:300px;
  background:#09111e;
  border:1px solid #1a2840;
  border-radius:6px;
  display:flex;flex-direction:column;
  z-index:201;
  pointer-events:auto;
  font-size:11px;
  box-shadow:0 8px 40px rgba(0,0,0,.8);
  overflow:hidden;
}
#panel-header{
  padding:12px 16px;
  background:#0d1828;
  border-bottom:1px solid #1a2840;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
#panel-icon{font-size:22px;margin-right:10px}
#panel-name{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:#fff}
#panel-type{font-size:9px;color:#3a6080;letter-spacing:2px;margin-top:2px}
#panel-close{
  background:none;border:none;color:#3a5070;cursor:pointer;
  font-size:20px;padding:4px 8px;border-radius:2px;
  transition:color .15s;line-height:1;flex-shrink:0;
}
#panel-close:hover{color:#fff}
#panel-body{
  flex:1;
  padding:14px 16px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.panel-section{margin-bottom:14px}
.panel-section-title{
  font-size:9px;letter-spacing:3px;color:#2a4a6a;
  text-transform:uppercase;margin-bottom:8px;
  padding-bottom:4px;border-bottom:1px solid #131e30;
}
.panel-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);
  gap:10px;
}
.panel-row:last-child{border:none}
.pk{color:#3a6080;font-size:10px;white-space:nowrap;flex-shrink:0}
.pv{color:#c8d8f0;font-size:10px;text-align:right;word-break:break-word}
.pv.ip{color:#ffb300}
.pv.green{color:#00c96e}
.pv.cyan{color:#00e5ff}
.pv.red{color:#ff6060}
.pv.purple{color:#cc88ff}

/* ── MOBILE: bottom sheet ── */
@media(max-width:700px){
  #panel{
    right:0;left:0;bottom:0;top:auto;
    width:100%;
    border-radius:12px 12px 0 0;
    max-height:70vh;
    min-height:200px;
  }
  /* drag handle */
  #panel-header::before{
    content:'';
    display:block;
    width:36px;height:4px;
    background:#2a4a6a;border-radius:2px;
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
  }
  #panel-header{ position:relative; padding-top:20px; }
  #panel-body{ font-size:12px; padding:12px 16px 24px; }
  .pk{ font-size:11px; }
  .pv{ font-size:11px; }
  .panel-section-title{ font-size:10px; }
  /* slide up animation */
  #panel{ transform:translateY(100%); transition:transform .3s cubic-bezier(.25,.8,.25,1); }
  #panel-overlay.open #panel{ transform:translateY(0); }
  #panel-overlay.open{ pointer-events:auto; }
  /* dim background */
  #panel-overlay::before{
    content:'';
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    z-index:-1;
  }
}

/* ── ZOOM CONTROLS ── */
#zoom-ctrl{
  position:absolute;left:16px;bottom:16px;
  display:flex;flex-direction:column;gap:4px;
  z-index:100;
}
.zb{
  width:32px;height:32px;
  background:#0a111e;border:1px solid #1a2840;
  color:#7a9cc0;font-size:16px;cursor:pointer;
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.zb:hover{background:#0d1828;color:#00e5ff;border-color:#00e5ff}

/* ── TOOLTIP ── */
#tooltip{
  position:absolute;
  background:#0d1828;border:1px solid #1a2840;
  padding:6px 10px;border-radius:3px;
  font-size:10px;color:#c8d8f0;
  pointer-events:none;display:none;z-index:200;
  white-space:nowrap;
}

/* ── INSTRUCTIONS ── */
#hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:9px;color:#1e3050;letter-spacing:2px;
  pointer-events:none;
}
</style>

// ── PANEL ───────────────────────────────────────────────────────────────────
function openPanel(id) {
  const d = DEVICES[id]; if(!d) return;
  document.getElementById('panel-icon').textContent = d.icon+' ';
  document.getElementById('panel-name').textContent = d.name;
  document.getElementById('panel-type').textContent = d.type;
  let html = '';
  for(const sec of d.sections) {
    html += `<div class="panel-section"><div class="panel-section-title">${sec.title}</div>`;
    for(const r of sec.rows) {
      const cls = r[2] ? `pv ${r[2]}` : 'pv';
      html += `<div class="panel-row"><span class="pk">${r[0]}</span><span class="${cls}">${r[1]}</span></div>`;
    }
    html += '</div>';
  }
  document.getElementById('panel-body').innerHTML = html;
  document.getElementById('panel-body').scrollTop = 0;
  document.getElementById('panel-overlay').classList.add('open');
}
function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
}

// Click devices
document.querySelectorAll('.device').forEach(g => {
  g.addEventListener('click', e => {
    e.stopPropagation();
    const id = g.dataset.id;
    openPanel(id);
    // Glow effect
    document.querySelectorAll('.device rect, .device circle').forEach(el => {
      el.style.filter = '';
    });
    g.querySelectorAll('rect, circle').forEach(el => {
      el.style.filter = 'url(#glow-cyan)';
    });
  });
  g.addEventListener('mouseenter', () => {
    const id = g.dataset.id;
    const d = DEVICES[id]; if(!d) return;
    const tip = document.getElementById('tooltip');
    tip.textContent = d.name + ' — ' + d.type;
    tip.style.display = 'block';
  });
  g.addEventListener('mousemove', e => {
    const tip = document.getElementById('tooltip');
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top = (e.clientY - 28) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    document.getElementById('tooltip').style.display = 'none';
  });
});

document.getElementById('topo').addEventListener('click', () => {
  closePanel();
  document.querySelectorAll('.device rect, .device circle').forEach(el => el.style.filter = '');
});

// Close panel when clicking the overlay background (mobile dim area)
document.getElementById('panel-overlay').addEventListener('click', e => {
  if(e.target === document.getElementById('panel-overlay')) closePanel();
});

// ── PAN & ZOOM ──────────────────────────────────────────────────────────────
const svg = document.getElementById('topo');
let vx=0, vy=0, vw=1200, vh=700;
let dragging=false, lastX=0, lastY=0;

function applyView() {
  svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
}
applyView();

function zoom(factor) {
  const cx = vx + vw/2, cy = vy + vh/2;
  vw *= factor; vh *= factor;
  vx = cx - vw/2; vy = cy - vh/2;
  applyView();
}
function resetView() {
  vx=0; vy=0; vw=1200; vh=700; applyView();
}

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = vx + (e.clientX - rect.left) / rect.width * vw;
  const my = vy + (e.clientY - rect.top) / rect.height * vh;
  const factor = e.deltaY > 0 ? 1.1 : 0.909;
  vw *= factor; vh *= factor;
  vx = mx - (e.clientX - rect.left) / rect.width * vw;
  vy = my - (e.clientY - rect.top) / rect.height * vh;
  applyView();
}, {passive:false});

svg.addEventListener('mousedown', e => {
  if(e.target.closest('.device')) return;
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  svg.style.cursor='grabbing';
});
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  const rect = svg.getBoundingClientRect();
  const dx = (e.clientX - lastX) / rect.width * vw;
  const dy = (e.clientY - lastY) / rect.height * vh;
  vx -= dx; vy -= dy;
  lastX = e.clientX; lastY = e.clientY;
  applyView();
});
window.addEventListener('mouseup', () => {
  dragging=false; svg.style.cursor='default';
});

// Touch pan/zoom
let touches = [];
svg.addEventListener('touchstart', e => { touches = [...e.touches]; }, {passive:true});
svg.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1 && touches.length === 1) {
    const rect = svg.getBoundingClientRect();
    const dx = (e.touches[0].clientX - touches[0].clientX) / rect.width * vw;
    const dy = (e.touches[0].clientY - touches[0].clientY) / rect.height * vh;
    vx -= dx; vy -= dy;
  } else if(e.touches.length === 2 && touches.length === 2) {
    const d0 = Math.hypot(touches[0].clientX-touches[1].clientX, touches[0].clientY-touches[1].clientY);
    const d1 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    const factor = d0/d1;
    const cx = vx+vw/2, cy = vy+vh/2;
    vw *= factor; vh *= factor;
    vx = cx-vw/2; vy = cy-vh/2;
  }
  touches = [...e.touches];
  applyView();
}, {passive:false});
</script>
